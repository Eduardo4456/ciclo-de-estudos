<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ciclo de Estudos | Organizador Inteligente</title>
    
    <!-- Bibliotecas Externas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.12.0/html2pdf.bundle.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style/style.css">
</head>
<body>
    <div id="container">
        <h1 class="titulo">Ciclo de Estudos</h1>

        <div class="card-section">
            <div class="input-group">
                <h2>Nome da matéria</h2>
                <input type="text" id="nome-materia" placeholder="Ex: Matemática, Direito...">
            </div>

            <div class="input-group">
                <h2>Qual seu nível de conhecimento?</h2>
                <div class="radio-container">
                    <label class="radio-item"><input type="radio" name="nivel" value="1"> Péssimo</label>
                    <label class="radio-item"><input type="radio" name="nivel" value="2"> Ruim</label>
                    <label class="radio-item"><input type="radio" name="nivel" value="3"> Mediano</label>
                    <label class="radio-item"><input type="radio" name="nivel" value="4"> Bom</label>
                    <label class="radio-item"><input type="radio" name="nivel" value="5" checked> Ótimo</label>
                </div>
            </div>

            <button type="button" class="btn" onclick="adicionarMateria()" id="btn-add">
                Adicionar Matéria
            </button>
        </div>
        
        <div id="section-lista" style="display: none;">
            <h2>Matérias Adicionadas</h2>
            <ul id="lista-materias"></ul>
        </div>

        <div class="card-section" style="margin-top: 30px;">
            <div class="input-group">
                <label for="horas"><b>Horas de estudo por dia:</b></label>
                <input type="text" id="horas" placeholder="Ex: 4" style="margin-top: 8px;">
            </div>
            
            <div class="input-group">
                <label for="quantidade_dias"><b>Dias por semana:</b></label>
                <select id="quantidade_dias" style="margin-top: 8px;">
                    <option value="1">1 dia</option>
                    <option value="2">2 dias</option>
                    <option value="3">3 dias</option>
                    <option value="4">4 dias</option>
                    <option value="5">5 dias</option>
                    <option value="6">6 dias</option>
                    <option value="7" selected>7 dias (Semana toda)</option>
                </select>
            </div>

            <button type="button" class="btn" onclick="gerarCiclo()">Gerar Ciclo Inteligente</button>
            <button type="button" class="btn btn-pdf" onclick="criarPDF()">Salvar em PDF</button>
        </div>

        <div id="resultado-ciclo" style="display: none;">
            <h2>Seu Ciclo Sugerido</h2>
            <p style="font-size: 0.9rem; margin-bottom: 10px; color: #666;">*Pesos calculados com base na sua dificuldade.</p>
            <ul id="ciclo"></ul>
        </div>

        <footer>
            <p>Desenvolvido por Carlos Eduardo
                <a href="https://www.linkedin.com/in/carlos-eduardo-a1b547330/" target="_blank">LinkedIn</a> | 
                <a href="https://github.com/Eduardo4456" target="_blank">GitHub</a>
            </p>
        </footer>
    </div>

    <script src="script/script.js"></script>
</body>
</html>
